services:
  - type: web
    name: olsc-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 squarespace_webhook.py
    envVars:
      - key: PASSKIT_PROGRAM_ID
        sync: false
      - key: PASSKIT_API_BASE
        value: https://api.pub2.passkit.io
      - key: PASSKIT_API_KEY
        sync: false
      - key: PASSKIT_PROJECT_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: TIMEZONE
        value: America/New_York

  - type: web
    name: olsc-web-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py
    envVars:
      - key: PROGRAM_ID
        sync: false
      - key: API_BASE
        value: https://api.pub2.passkit.io
      - key: PASSKIT_API_KEY
        sync: false
      - key: PASSKIT_PROJECT_KEY
        sync: false
      - key: TIMEZONE
        value: America/New_York
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_PASS_TYPE_ID
        sync: false
      - key: APPLE_CERT_PASSWORD
        sync: false
      - key: APPLE_PASS_CERT_P12_BASE64
        sync: false
      - key: APPLE_WWDR_PEM_BASE64
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
