services:
  - type: web
    name: olsc-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 squarespace_webhook.py
    envVars:
      - key: PASSKIT_PROGRAM_ID
        sync: false
      - key: PASSKIT_API_BASE
        value: https://api.pub2.passkit.io
      - key: PASSKIT_API_KEY
        sync: false
      - key: PASSKIT_PROJECT_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: TIMEZONE
        value: America/New_York

  - type: web
    name: olsc-web-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Was `python3 app.py` -- Flask's built-in dev server, explicitly not
    # meant for concurrent production traffic. Confirmed for real on
    # Aug 24: a single push notification woke ~95 devices within a few
    # seconds, and the dev server couldn't absorb that burst -- it fell
    # over (502/503) and Render had to restart it.
    #
    # One process, multiple threads -- not multiple worker processes.
    # This app is I/O-bound (DB/API calls), which threads handle well
    # despite the GIL, and login rate-limiting (app.py's _login_attempts)
    # is a plain in-memory dict: separate worker *processes* wouldn't
    # share it, quietly halving (or worse) its effectiveness. Threads
    # share memory, so the rate limiter stays fully intact.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 180
    envVars:
      - key: PROGRAM_ID
        sync: false
      - key: API_BASE
        value: https://api.pub2.passkit.io
      - key: PASSKIT_API_KEY
        sync: false
      - key: PASSKIT_PROJECT_KEY
        sync: false
      - key: TIMEZONE
        value: America/New_York
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_PASS_TYPE_ID
        sync: false
      - key: APPLE_CERT_PASSWORD
        sync: false
      - key: APPLE_PASS_CERT_P12_BASE64
        sync: false
      - key: APPLE_WWDR_PEM_BASE64
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
