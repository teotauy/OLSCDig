<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Member - OLSC Brooklyn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e31b23 0%, #00a65a 100%);
            background-image: url("{{ url_for('static', filename='background.png') }}"), linear-gradient(135deg, #e31b23 0%, #00a65a 100%);
            background-size: cover, auto;
            background-position: center, 0 0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px; margin: 0 auto; background: white; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 30px;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header p.brand { font-size: 12px; color: #e31b23; margin-bottom: 4px; }
        .header h1 { color: #e31b23; font-size: 22px; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;
        }
        input:focus { outline: none; border-color: #e31b23; }
        .btn {
            padding: 14px 18px; background: linear-gradient(135deg, #e31b23 0%, #d81d42 100%);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
            min-height: 48px; width: 100%;
        }
        .links { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
        .links a { color: #e31b23; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p class="brand">OLSC Brooklyn</p>
            <h1>Edit</h1>
        </div>

        {% if error %}<div class="message error">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="first_name">First name *</label>
                <input type="text" id="first_name" name="first_name" value="{{ member.first_name }}" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last name *</label>
                <input type="text" id="last_name" name="last_name" value="{{ member.last_name }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" value="{{ member.email }}" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" value="{{ member.phone or '' }}">
            </div>
            <button type="submit" class="btn">Save</button>
        </form>

        {% include '_admin_footer.html' %}
    </div>
    {% include '_loading_overlay.html' %}
</body>
</html>
