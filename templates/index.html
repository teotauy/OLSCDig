<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - OLSC Brooklyn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #e31b23 0%, #00a65a 100%);
            background-image: url("{{ url_for('static', filename='background.png') }}"), linear-gradient(135deg, #e31b23 0%, #00a65a 100%);
            background-size: cover, auto;
            background-position: center, 0 0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header p { color: #666; font-size: 14px; }
        .hub {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .hub a {
            display: block;
            box-sizing: border-box;
            min-height: 64px;
            padding: 20px 10px;
            background: #f4f4f4;
            color: #1a1a1a;
            text-decoration: none;
            font-size: 16px;
            font-weight: 800;
            border-radius: 14px;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: rgba(227, 27, 35, 0.18);
        }
        .hub a.do { background: #e31b23; color: #fff; }
        .hub-tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }
        .hub-tools a {
            display: block;
            box-sizing: border-box;
            min-height: 48px;
            padding: 14px 8px;
            background: #fafafa;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
        }
        @media (max-width: 719px) {
            .hub-tools { margin-bottom: 8px; }
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ wordmark_data_uri }}" alt="OLSC Brooklyn — Official Supporters Club" style="max-width: 200px; height: auto; margin: 0 auto 10px;">
            <p>Home</p>
        </div>

        <div class="hub">
            <a class="do" href="{{ url_for('scanner') }}">Scan in</a>
            <a href="{{ url_for('scanner', mode='search') }}">Find someone</a>
            <a href="{{ url_for('admin_members') }}#add">Add someone</a>
            <a href="{{ url_for('admin_leaderboard') }}">Scores</a>
        </div>
        <div class="hub-tools">
            <a href="{{ url_for('admin_members') }}">People</a>
            <a href="{{ url_for('admin_matches') }}">Door night</a>
            <a href="{{ url_for('admin_issue_passes') }}">Send first pass</a>
            <a href="{{ url_for('admin_pass_remediation') }}">Fix old pass</a>
            <a href="{{ url_for('admin_door_access') }}">Door link</a>
            <a href="{{ url_for('index') }}">How full</a>
            <a href="{{ url_for('logout') }}">Log out</a>
        </div>
    </div>
    {% include '_admin_footer.html' %}
    {% include '_loading_overlay.html' %}
</body>
</html>
