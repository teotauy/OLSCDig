<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OLSC Brooklyn - Headcount</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #e31b23 0%, #00a65a 100%);
            background-image: url("{{ url_for('static', filename='background.png') }}"), linear-gradient(135deg, #e31b23 0%, #00a65a 100%);
            background-size: cover, auto;
            background-position: center, 0 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #e31b23;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .headcount {
            background: linear-gradient(135deg, #e31b23 0%, #d81d42 100%);
            color: white;
            text-align: center;
            padding: 40px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(227,27,35,0.3);
        }

        .headcount-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .headcount-number {
            font-size: 72px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 10px;
        }

        .headcount-updated {
            font-size: 12px;
            opacity: 0.8;
        }

        .loading {
            opacity: 0.6;
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.show {
            display: block;
        }

        .auto-refresh {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }

        .countdown-pitch {
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(180deg, #2d7a3e 0%, #1e5f2d 100%);
            border-radius: 10px;
            position: relative;
            height: 60px;
            overflow: hidden;
        }

        .pitch-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        .halfway-line {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: white;
        }

        .goal {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
        }

        .ball {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            transition: left 1s linear;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
        }

        .countdown-text {
            text-align: center;
            color: white;
            font-size: 11px;
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @keyframes celebrate {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.3) rotate(360deg); }
        }

        .ball.goal-scored {
            animation: celebrate 0.5s ease-in-out;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .links a {
            color: #e31b23;
            text-decoration: none;
            font-size: 14px;
            margin: 0 8px;
        }

        .nav-footer {
            text-align: center;
            margin-top: 12px;
        }

        .nav-footer a {
            color: #999;
            text-decoration: none;
            font-size: 12px;
        }

        .nav-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .headcount-number {
                font-size: 64px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ wordmark_data_uri }}" alt="OLSC Brooklyn — Official Supporters Club" style="max-width: 200px; height: auto; margin: 0 auto 10px;">
            <p>Admin Panel</p>
        </div>

        <div class="headcount" id="headcount">
            <div class="headcount-label">Checked In (Current Match)</div>
            <div class="headcount-number" id="count">--</div>
            <div class="headcount-updated" id="updated">Loading...</div>
        </div>

        <div class="status-message" id="statusMessage"></div>

        <div class="countdown-pitch">
            <div class="pitch-lines">
                <div class="halfway-line"></div>
            </div>
            <div class="ball" id="ball">⚽</div>
            <div class="goal">🥅</div>
        </div>
        <div class="countdown-text">
            <span id="countdown">{{ headcount_refresh_seconds }}</span>s until next refresh
        </div>

        {% include '_admin_footer.html' %}
        <div class="nav-footer">
            <a href="/">← Public View</a>
        </div>
    </div>

    <script>
        const REFRESH_SECONDS = {{ headcount_refresh_seconds }};
        let refreshInterval;
        let countdownInterval;
        let secondsLeft = REFRESH_SECONDS;

        function startCountdown() {
            secondsLeft = REFRESH_SECONDS;
            const countdownEl = document.getElementById('countdown');
            const ballEl = document.getElementById('ball');
            
            countdownEl.textContent = secondsLeft;
            ballEl.style.left = '10px';
            ballEl.classList.remove('goal-scored');
            
            if (countdownInterval) clearInterval(countdownInterval);
            
            countdownInterval = setInterval(() => {
                secondsLeft--;
                countdownEl.textContent = secondsLeft;
                
                // Move ball across pitch (from 10px to ~85% of width)
                const progress = (REFRESH_SECONDS - secondsLeft) / REFRESH_SECONDS;
                const containerWidth = ballEl.parentElement.offsetWidth;
                const maxLeft = containerWidth - 50; // Leave room for goal
                ballEl.style.left = (10 + (maxLeft * progress)) + 'px';
                
                // GOAL! Animation when it reaches the end
                if (secondsLeft === 1) {
                    ballEl.classList.add('goal-scored');
                }
                
                if (secondsLeft <= 0) {
                    secondsLeft = REFRESH_SECONDS;
                }
            }, 1000);
        }

        async function fetchHeadcount() {
            try {
                const response = await fetch('/api/headcount');
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('count').textContent = data.count;
                    
                    const updatedDate = new Date(data.updated_at);
                    const timeStr = updatedDate.toLocaleTimeString('en-US', { 
                        hour: 'numeric', 
                        minute: '2-digit'
                    });
                    document.getElementById('updated').textContent = `Updated at ${timeStr}`;
                } else {
                    showStatus('Error loading headcount', 'error');
                }
            } catch (error) {
                showStatus('Connection error', 'error');
                console.error('Error fetching headcount:', error);
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type} show`;
            
            // Hide after 5 seconds
            setTimeout(() => {
                statusDiv.classList.remove('show');
            }, 5000);
        }

        // Initial load
        fetchHeadcount();
        startCountdown();

        // Auto-refresh (interval set by HEADCOUNT_REFRESH_SECONDS, default 60)
        refreshInterval = setInterval(() => {
            fetchHeadcount();
            startCountdown();
        }, REFRESH_SECONDS * 1000);

        // Pause polling entirely while the tab isn't visible (backgrounded,
        // minimized, another tab focused) rather than just letting it keep
        // firing unseen — a stray tab left open indefinitely was quietly
        // keeping the server from ever going idle. Resume with an
        // immediate refresh when it becomes visible again.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(refreshInterval);
                clearInterval(countdownInterval);
            } else {
                fetchHeadcount();
                startCountdown();
                refreshInterval = setInterval(() => {
                    fetchHeadcount();
                    startCountdown();
                }, REFRESH_SECONDS * 1000);
            }
        });
    </script>
    {% include '_loading_overlay.html' %}
</body>
</html>
